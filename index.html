<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17121a"><title>Pink Vault</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#17121a}*{box-sizing:border-box}body{margin:0}.app{max-width:680px;margin:auto;padding:18px 15px 100px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{background:#f472b6;color:#23121d;border-radius:14px;padding:12px;font-size:22px}.muted{color:#d1b6c8;font-size:13px}.top h1{font-size:20px;margin:0;letter-spacing:1px}.card{background:#2e2531;border-radius:18px;padding:17px;margin-bottom:13px;min-width:0}.hero{background:linear-gradient(120deg,#753d61,#422b40)}.label{color:#eac4d9;font-size:13px}.amount{font-size:31px;font-weight:750;margin:7px 0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:15px;background:#312735;border-radius:15px;min-width:0}.tile b{display:block;font-size:20px;margin-top:8px;overflow-wrap:anywhere}.tile small{color:#d4bacc}.heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 0 12px}.heading h2{font-size:18px;margin:0}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 15px;background:#f472b6;color:#241420;font-weight:700;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#50374a;color:#ffd3e8}.small{font-size:13px;padding:9px 11px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row>span:last-child{flex-shrink:0}.field{margin:13px 0}.field label{display:block;color:#eac4d9;font-size:13px;margin-bottom:6px}input,select{width:100%;background:#1e1922;border:1px solid #675366;color:white;border-radius:11px;padding:12px;min-width:0}input:focus,select:focus{outline:2px solid #f472b6}.hint{color:#c9b0c1;font-size:12px;line-height:1.45}.bill{padding:13px 0;border-bottom:1px solid #514052}.bill:last-child{border:0}.pill{font-size:12px;color:#ffc4e0;background:#56374e;border-radius:99px;padding:5px 9px}.nav{position:fixed;bottom:0;left:0;right:0;background:#211924;border-top:1px solid #4e3a4b;padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;z-index:3}.nav button{background:transparent;color:#bfa6b7;flex:1;max-width:125px;padding:10px 4px;font-size:12px}.nav button.active{background:#67384f;color:#ffe1ee}.hidden{display:none!important}.activity{border-bottom:1px solid #493949;padding:12px 0}.activity:last-child{border:0}.good{color:#f9b4d7}.warning{color:#ffacb7}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.notice{background:#443042;border-radius:12px;padding:12px;font-size:13px;color:#ffe1ee}.modalwrap{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}.modal{background:#302533;border:1px solid #765269;border-radius:18px;padding:20px;width:min(100%,430px)}.modal h3{margin-top:0}hr{border:0;border-top:1px solid #514052;margin:15px 0}@media(min-width:650px){.app{padding-top:30px}.nav{max-width:680px;margin:auto;border-radius:18px 18px 0 0}}@media(max-width:360px){.amount{font-size:27px}.tile b{font-size:17px}.app{padding-left:10px;padding-right:10px}}
</style></head><body><main class="app"><header class="top"><div class="logo">♥</div><div><h1>PINK VAULT</h1><div class="muted">Your personal money manager</div></div></header><div id="content"></div></main><nav class="nav" id="nav"></nav><div id="modalRoot"></div><script>
const KEY='pink-vault-v1';const defaultState={accounts:{checking:0,bills:0,cash:0,cashapp:0},weekly:{phone:0,teeth:0,insurance:0,cash:0,cashapp:0},paycheck:0,bills:[{id:'phone',name:'Phone',dueDay:25,amount:93},{id:'teeth',name:'Teeth',dueDay:1,amount:108},{id:'insurance',name:'Car insurance',dueDay:3,amount:80}],transactions:[],paid:{},setupComplete:false};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultState)}catch{state=structuredClone(defaultState)};let tab='home';const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n||0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const round=n=>Math.round((n+Number.EPSILON)*100)/100;const totalBills=()=>round(state.weekly.phone+state.weekly.teeth+state.weekly.insurance);const total=()=>round(Object.values(state.accounts).reduce((a,b)=>a+b,0));const names={checking:'Checking',bills:'Online bills savings',cash:'Cash savings',cashapp:'Cash App'};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Device storage is unavailable. Export a backup to keep your data.')}};function record(type,label,amount,from,to){state.transactions.unshift({id:Date.now()+Math.random(),date:new Date().toISOString(),type,label,amount:round(amount),from,to});save();render()};function move(from,to,amount,label){amount=round(amount);if(!Number.isFinite(amount)||amount<=0||from===to||state.accounts[from]<amount){alert('Check the amount and available balance.');return false}state.accounts[from]=round(state.accounts[from]-amount);state.accounts[to]=round(state.accounts[to]+amount);record('Transfer',label||'Account transfer',amount,from,to);return true};function field(id,label,value,step='0.01'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${value}"></div>`};function getNum(id){let x=Number($('#'+id).value);return Number.isFinite(x)&&x>=0?round(x):NaN};function options(){return Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')};function setTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})};function render(){const tabs=[['home','⌂','Home'],['bills','▦','Bills'],['activity','↔','Activity'],['settings','⚙','Settings']];$('#nav').innerHTML=tabs.map(([id,icon,name])=>`<button class="${tab===id?'active':''}" onclick="setTab('${id}')">${icon}<br>${name}</button>`).join('');$('#content').innerHTML=tab==='home'?home():tab==='bills'?billsPage():tab==='activity'?activity():settings()};function home(){let left=round(state.paycheck-totalBills()-state.weekly.cash-state.weekly.cashapp);return `<section class="card hero"><div class="label">Total tracked money</div><div class="amount">${money(total())}</div><div class="hint">Manually tracked balances · not connected to your bank</div></section><div class="grid">${Object.entries(names).map(([k,n])=>`<div class="tile"><small>${n}</small><b>${money(state.accounts[k])}</b></div>`).join('')}</div><div class="heading"><h2>Friday paycheck split</h2></div><section class="card">${field('pay','New paycheck amount ($)',state.paycheck)}<div class="row"><span>Bills savings</span><b>${money(totalBills())}</b></div><div class="row"><span>Cash savings</span><b>${money(state.weekly.cash)}</b></div><div class="row"><span>Cash App spending</span><b>${money(state.weekly.cashapp)}</b></div><hr><div class="row"><b>Keep in checking</b><b class="${left<0?'warning':'good'}">${money(left)}</b></div><p class="hint">Only record a paycheck if it has NOT already been included in your starting checking balance.</p><button style="width:100%" onclick="paycheck()">Record and split a new paycheck</button></section><div class="heading"><h2>Quick transfer</h2></div><section class="card"><p class="hint">Transfer between your tracked accounts after making the real transfer.</p><button class="secondary" style="width:100%" onclick="transferModal()">Record an account transfer</button></section>${!state.setupComplete?'<div class="notice">Starting figures are based on our conversation. The $60 cash savings and $10 Cash App entries are estimates of transfers, not confirmed total balances. Verify all balances under Settings before relying on totals.</div>':''}`};function nextDate(day){let d=new Date(),y=d.getFullYear(),m=d.getMonth();let t=new Date(y,m,day);if(t<new Date(y,m,d.getDate()))t=new Date(y,m+1,day);return t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};function billsPage(){return `<section class="card hero"><div class="label">Bills savings balance</div><div class="amount">${money(state.accounts.bills)}</div><div class="hint">Weekly planned transfer: ${money(totalBills())}</div></section><section class="card"><h2 style="font-size:18px;margin-top:0">Upcoming payments</h2>${state.bills.map(b=>`<div class="bill"><div class="row"><b>${esc(b.name)}</b><span class="pill">${nextDate(b.dueDay)}</span></div><div class="row" style="margin-top:8px"><span class="muted">Estimated full payment: ${money(b.amount)}</span><button class="small secondary" onclick="markPaid('${b.id}')">Record paid</button></div></div>`).join('')}<p class="hint">Payment amounts are estimates from your weekly allocations (4 weeks each). Edit the real bill amounts in Settings. When a bill is due, transfer funds back to checking in your bank before payment.</p></section><section class="card"><div class="row"><span>Reserve one week's bills</span><b>${money(totalBills())}</b></div><p class="hint">Only record this after transferring the money in First Citizens.</p><button style="width:100%" onclick="reserveBills()">Record transfer to bills savings</button></section>`};function activity(){return `<section class="card"><h2 style="margin-top:0;font-size:18px">Add a transaction</h2><div class="field"><label>Transaction type</label><select id="txType"><option value="Expense">Expense</option><option value="Deposit">Deposit</option></select></div>${field('txLabel','Description','')}${field('txAmount','Amount ($)','')}<div class="field"><label>Account</label><select id="txAccount">${options()}</select></div><button style="width:100%" onclick="addTransaction()">Record transaction</button></section><div class="heading"><h2>History</h2><button class="small secondary" onclick="exportBackup()">Export backup</button></div><section class="card">${state.transactions.length?state.transactions.map(t=>`<div class="activity"><div class="row"><b>${esc(t.label)}</b><b class="${t.type==='Expense'?'warning':'good'}">${t.type==='Expense'?'-':t.type==='Deposit'?'+':''}${money(t.amount)}</b></div><div class="hint">${new Date(t.date).toLocaleString()} · ${esc(t.type)} · ${esc(names[t.from]||t.from||'')} ${t.to?'→ '+esc(names[t.to]||t.to):''}</div></div>`).join(''):'<p class="muted">No new transactions recorded yet. Previous bank transactions are already included in your opening balance.</p>'}</section>`};function settings(){return `<section class="card"><h2 style="font-size:18px;margin-top:0">Account balances</h2><p class="hint">Use your bank’s available balance. Enter actual total balances for cash savings and Cash App.</p>${Object.entries(names).map(([k,n])=>field('acc_'+k,n+' ($)',state.accounts[k])).join('')}<button onclick="saveAccounts()">Save account balances</button></section><section class="card"><h2 style="font-size:18px;margin-top:0">Weekly paycheck rules</h2>${Object.entries({phone:'Phone bill',teeth:'Teeth payment',insurance:'Car insurance',cash:'Cash savings',cashapp:'Cash App'}).map(([k,n])=>field('wk_'+k,n+' ($)',state.weekly[k])).join('')}<button onclick="saveWeekly()">Save weekly rules</button></section><section class="card"><h2 style="font-size:18px;margin-top:0">Full bill amounts</h2><p class="hint">Enter actual amounts due, not weekly savings allocations.</p>${state.bills.map(b=>field('bill_'+b.id,b.name+' payment ($)',b.amount)).join('')}<button onclick="saveBillAmounts()">Save bill amounts</button></section><section class="card"><h2 style="font-size:18px;margin-top:0">Data backup</h2><p class="hint">Your data is saved in this browser on this device. Clearing browser data, using private browsing, or opening the file in a different app can erase or separate your saved data. Export backups regularly.</p><div class="actions"><button onclick="exportBackup()">Download backup</button><button class="secondary" onclick="$('#importFile').click()">Restore backup</button></div><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importBackup(event)"></section>`};function paycheck(){let p=getNum('pay');if(!Number.isFinite(p)||p<=0||p<totalBills()+state.weekly.cash+state.weekly.cashapp){alert('Your paycheck must cover your planned allocations.');return}if(!confirm(`Is ${money(p)} a NEW paycheck not already counted in checking? This will add it to your tracked balances and split it.`))return;state.paycheck=p;state.accounts.checking=round(state.accounts.checking+p-totalBills()-state.weekly.cash-state.weekly.cashapp);state.accounts.bills=round(state.accounts.bills+totalBills());state.accounts.cash=round(state.accounts.cash+state.weekly.cash);state.accounts.cashapp=round(state.accounts.cashapp+state.weekly.cashapp);record('Paycheck','New paycheck and allocations',p,'checking','split');alert('Paycheck recorded in the tracker. Make the matching real transfers in your banking apps.');};function reserveBills(){let a=totalBills();if(!confirm(`Have you already transferred ${money(a)} from checking to online savings at First Citizens?`))return;move('checking','bills',a,'Weekly bills reserve')};function transferModal(){showModal(`<h3>Record account transfer</h3><div class="field"><label>From</label><select id="from">${options()}</select></div><div class="field"><label>To</label><select id="to">${options()}</select></div>${field('transferAmount','Amount ($)','70.25')}<p class="hint">Make the real bank transfer first. This only updates your tracker.</p><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button onclick="submitTransfer()">Record transfer</button></div>`)};function showModal(html){$('#modalRoot').innerHTML=`<div class="modalwrap"><div class="modal">${html}</div></div>`};function closeModal(){$('#modalRoot').innerHTML=''};function submitTransfer(){let from=$('#from').value,to=$('#to').value,amount=getNum('transferAmount');if(!confirm('Have you already completed the real transfer?'))return;if(move(from,to,amount,'Account transfer'))closeModal()};function markPaid(id){let b=state.bills.find(x=>x.id===id);showModal(`<h3>Record ${esc(b.name)} payment</h3><p class="hint">Record a payment only once it is reflected in your checking balance. Do not double-count it if you already adjusted the account manually.</p>${field('payment','Payment amount ($)',b.amount)}<div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button onclick="submitPayment('${id}')">Record payment</button></div>`)};function submitPayment(id){let a=getNum('payment'),b=state.bills.find(x=>x.id===id);if(!Number.isFinite(a)||a<=0||a>state.accounts.checking){alert('Check the payment amount and checking balance.');return}state.accounts.checking=round(state.accounts.checking-a);state.paid[id]=new Date().toISOString();record('Expense',b.name+' bill payment',a,'checking',null);closeModal()};function addTransaction(){let a=getNum('txAmount'),type=$('#txType').value,k=$('#txAccount').value,label=$('#txLabel').value.trim();if(!label||!Number.isFinite(a)||a<=0||type==='Expense'&&a>state.accounts[k]){alert('Enter a description and valid amount within the account balance.');return}state.accounts[k]=round(state.accounts[k]+(type==='Expense'?-a:a));record(type,label,a,k,null)};function saveAccounts(){let vals={};for(let k of Object.keys(names)){vals[k]=getNum('acc_'+k);if(!Number.isFinite(vals[k]))return alert('Enter valid balances.')}if(!confirm('Replace tracked balances with these current actual balances?'))return;state.accounts=vals;state.setupComplete=true;save();render()};function saveWeekly(){let vals={};for(let k of Object.keys(state.weekly)){vals[k]=getNum('wk_'+k);if(!Number.isFinite(vals[k]))return alert('Enter valid amounts.')}state.weekly=vals;save();render()};function saveBillAmounts(){for(let b of state.bills){let a=getNum('bill_'+b.id);if(!Number.isFinite(a))return alert('Enter valid bill amounts.');b.amount=a}save();render()};function exportBackup(){let blob=new Blob([JSON.stringify({app:'Pink Vault',version:1,data:state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pink-vault-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.app!=='Pink Vault'||!data.data?.accounts||!data.data?.weekly||!Array.isArray(data.data.transactions))throw Error('Invalid backup');for(let k of Object.keys(names))if(typeof data.data.accounts[k]!=='number'||!Number.isFinite(data.data.accounts[k])||data.data.accounts[k]<0)throw Error('Invalid balances');if(!confirm('Replace all current Pink Vault data with this backup?'))return;state=data.data;save();render();alert('Backup restored.')}catch(err){alert('Could not restore backup: '+err.message)}};render();
</script></body></html>
